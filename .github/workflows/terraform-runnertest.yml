name: Terraform - runnertest

on:
  push:
    branches: [ main ]
    paths:
      - 'runnertest/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'runnertest/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  terraform:
    runs-on: [self-hosted, test]   # "test" is your runner name/label
    defaults:
      run:
        working-directory: ./runnertest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug role ARN
        run: 'echo "Role ARN length: ${#ROLE_ARN}"'
        env:
          ROLE_ARN: ${{ secrets.ARN_NAME }}  

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN_NAME}}
          aws-region: us-west-2   # change to your region

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5    # pin to whatever version you use

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan -out=tfplan

      - name: Terraform Plan (for apply/destroy runs too)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan'
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan 

      
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve  
